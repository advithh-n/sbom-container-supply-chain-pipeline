name: Secure software supply chain

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  LOCAL_IMAGE: grid-api:${{ github.sha }}

jobs:
  build-scan-sign:
    name: Build, generate SBOM, enforce policy, sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test and audit dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Build local container
        run: docker build --pull --tag "$LOCAL_IMAGE" .

      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: "${{ env.LOCAL_IMAGE }}"
          format: spdx-json
          output-file: artifacts/sbom.spdx.json
          artifact-name: sbom-spdx

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: "${{ env.LOCAL_IMAGE }}"
          format: cyclonedx-json
          output-file: artifacts/sbom.cyclonedx.json
          artifact-name: sbom-cyclonedx

      - name: Scan SPDX SBOM with Grype and block critical CVEs
        id: grype
        uses: anchore/scan-action@v7
        with:
          sbom: artifacts/sbom.spdx.json
          fail-build: true
          severity-cutoff: critical
          output-format: json
          output-file: artifacts/grype-results.json
          cache-db: true

      - name: Trivy image report for GitHub code scanning
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: "${{ env.LOCAL_IMAGE }}"
          format: sarif
          output: artifacts/trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: artifacts/trivy-results.sarif

      - name: Enforce independent Trivy critical-CVE gate
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: "${{ env.LOCAL_IMAGE }}"
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate enterprise compliance report
        if: always()
        run: >-
          python scripts/compliance_report.py
          --sbom artifacts/sbom.spdx.json
          --grype artifacts/grype-results.json
          --json-output artifacts/compliance-report.json
          --markdown-output artifacts/compliance-report.md

      - name: Upload compliance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-compliance-evidence
          path: artifacts/
          retention-days: 30

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Generate OCI metadata
        if: github.event_name != 'pull_request'
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: "${{ env.IMAGE_NAME }}"
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Push verified image by digest
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: "${{ steps.metadata.outputs.tags }}"
          labels: "${{ steps.metadata.outputs.labels }}"

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2

      - name: Keylessly sign immutable image digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: "${{ steps.push.outputs.digest }}"
          TAGS: "${{ steps.metadata.outputs.tags }}"
        run: |
          while IFS= read -r tag; do
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "$TAGS"

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: "${{ env.IMAGE_NAME }}"
          subject-digest: "${{ steps.push.outputs.digest }}"
          push-to-registry: true
